# The dev server: the app, Redis (Valkey) and the nginx proxy. Only the proxy publishes ports; the app and Redis are on a private network.
# Used by deploy/remote-deploy.sh, which sets IMAGE. Settings live in /opt/circaso/.env on the server (see deploy/dev.env.example).
name: circaso

services:
  app:
    image: ${IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      LOG_FORMAT: JSON
      LOG_COLOR: "false"
      APP_VERSION: ${APP_VERSION:-dev}
    depends_on:
      valkey:
        condition: service_healthy
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    pids_limit: 512

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes: [valkey-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [internal]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN]
    security_opt: ["no-new-privileges:true"]

  nginx:
    image: nginx:1-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [app]
    networks: [internal]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]

networks:
  internal:

volumes:
  valkey-data:
