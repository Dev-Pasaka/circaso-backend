# The dev server: the app, Redis (Valkey) and the nginx proxy. Only the proxy publishes a port (443); the app and Redis publish none.
# Networks: circaso-backend (external, created once with `docker network create circaso-backend`) joins nginx and the app; circaso-data (internal, no internet) joins the
# app and Redis, so nginx cannot reach Redis and Redis cannot reach the internet. Nothing uses Compose's default network.
# Reference copy of the server's file; the deploy workflow sets IMAGE and runs `docker compose up -d`. Settings live in /opt/circaso/.env on the server (see deploy/dev.env.example).
name: circaso

services:
  app:
    image: ${IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      LOG_FORMAT: JSON
      LOG_COLOR: "false"
      APP_VERSION: ${APP_VERSION:-dev}
    depends_on:
      valkey:
        condition: service_healthy
    networks: [backend, data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    pids_limit: 512

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes: [valkey-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [data]
    # Run as the image's valkey user: the root entrypoint's chown of /data fails once appendonlydir exists, because cap_drop removes DAC_OVERRIDE.
    user: "999:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  docs:
    image: ${DOCS_IMAGE}
    restart: unless-stopped
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

  nginx:
    image: nginx:1-alpine
    restart: unless-stopped
    ports: ["443:443"]
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [app]
    networks: [backend]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]

networks:
  backend:
    name: circaso-backend
    external: true
  data:
    name: circaso-data
    internal: true

volumes:
  valkey-data:
