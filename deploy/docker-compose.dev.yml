# The dev server: the app, Redis (Valkey), Postgres, pgAdmin, the docs reader and the nginx proxy. Only the proxy publishes a port (443).
# Networks: circaso-backend (external, created once with `docker network create circaso-backend`) joins nginx, the app, docs and pgAdmin; circaso-data (internal, no internet) joins the
# app and Redis, so nginx cannot reach Redis and Redis cannot reach the internet. Nothing uses Compose's default network.
# Reference copy of /opt/circaso/docker-compose.yml. The deploy workflow and /opt/circaso/up.sh set IMAGE and DOCS_IMAGE and run `docker compose up -d`. Settings live in
# /opt/circaso/.env (see deploy/dev.env.example); Postgres and pgAdmin secrets in /opt/circaso/postgres.env (see deploy/postgres.env.example). deploy/postgres and
# deploy/nginx are copied to /opt/circaso/postgres and /opt/circaso/nginx.
name: circaso

services:
  app:
    image: ${IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      LOG_FORMAT: JSON
      LOG_COLOR: "false"
      APP_VERSION: ${APP_VERSION:-dev}
    depends_on:
      valkey:
        condition: service_healthy
      # The app opens its PostgreSQL pools at start, so the database must be up first.
      postgres:
        condition: service_healthy
    networks: [backend, data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    pids_limit: 512

  # The ops gateway (decision 2026-11-08): the staff API for the admin portal, its own process from the same image as `app`
  # (main class com.circaso.app.OpsMain), on :8081, reached only through nginx's admin-api.circaso.com block
  # (nginx/admin-api.conf). Same .env (its own OPS_* settings, see dev.env.example) and smaller pools: it shares
  # PostgreSQL's connection budget with the app. It runs no stream consumers or jobs, so one instance is enough.
  # Reference only: add it to /opt/circaso/docker-compose.yml when the portal goes live.
  ops:
    image: ${IMAGE}
    restart: unless-stopped
    env_file: .env
    entrypoint: ["sh", "-c", "exec java $$JAVA_OPTS --enable-native-access=ALL-UNNAMED -cp '/app/lib/*' com.circaso.app.OpsMain"]
    environment:
      LOG_FORMAT: JSON
      LOG_COLOR: "false"
      APP_VERSION: ${APP_VERSION:-dev}
      OPS_PORT: "8081"
      DATABASE_POOL_APP_SIZE: "4"
      DATABASE_POOL_JOBS_SIZE: "1"
    # The image's own HEALTHCHECK probes the app's :8080; this process listens on :8081.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health/live"]
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks: [backend, data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 256

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes: [valkey-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [data]
    # Runs as uid:gid 999:1000 (the image's valkey user, which owns /data and appendonlydir), so it needs no privileges at all. As root
    # with everything dropped it cannot even read a data folder it already created, and the restart after a deploy would fail.
    user: "999:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  docs:
    image: ${DOCS_IMAGE}
    restart: unless-stopped
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

  # PostgreSQL, the app's database. Only the app and pgAdmin reach it: no published
  # port, on the internal data network. Its secrets live in postgres.env (mode 600), not .env, so the app container never sees them.
  postgres:
    image: postgres:18
    restart: unless-stopped
    env_file: postgres.env
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - superuser_reserved_connections=3
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - log_min_duration_statement=500
    volumes:
      - postgres-data:/var/lib/postgresql
      # Run once, on the first start with an empty volume: the read-only browsing role and the app's three login roles
      # (on the existing volume, run 20-login-roles.sh by hand once: postgres/README.md).
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d circaso"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [data]
    shm_size: 256m
    mem_limit: 1536m
    cap_drop: [ALL]
    # The entrypoint fixes the data folder's owner and drops to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]

  # Browsing and querying, at https://sandbox-db.circaso.com behind Cloudflare Access (nginx/sandbox-db.conf). No published port:
  # nginx reaches it on the backend network, and it reaches Postgres on the data network.
  pgadmin:
    image: dpage/pgadmin4:9.18
    restart: unless-stopped
    env_file: postgres.env
    environment:
      PGADMIN_LISTEN_PORT: "5050"
      PGADMIN_DISABLE_POSTFIX: "true"
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      # Behind nginx and Cloudflare: trust one hop of X-Forwarded-For/-Proto, so pgAdmin builds https links.
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: "1"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./postgres/pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend, data]
    mem_limit: 512m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  nginx:
    image: nginx:1-alpine
    restart: unless-stopped
    ports: ["443:443"]
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [app]
    networks: [backend]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]

networks:
  backend:
    name: circaso-backend
    external: true
  data:
    name: circaso-data
    internal: true

volumes:
  valkey-data:
  postgres-data:
  pgadmin-data:
