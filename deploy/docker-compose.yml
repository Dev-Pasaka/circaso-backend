# Local development: PostgreSQL, ScyllaDB (until every module has moved to PostgreSQL) and Redis (Valkey is
# wire-compatible). The vendors (SMS, email, push, Circle) are not here: locally the `log` and `fake` integrations stand
# in for them.
#
#   docker compose -f deploy/docker-compose.yml up -d
#   ./gradlew :app:migrate                   # create the schemas and roles and run the migrations, as a deploy does
#   ./gradlew :app:run                       # serve on :8080, colored console
#   settings come from environment variables, locally from .env (copy .env.example)
#
#   docker compose -f deploy/docker-compose.yml --profile tools up -d   # adds pgAdmin on http://localhost:5050
name: circaso

services:
  # The same image as the sandbox and CI. The init scripts are the server's: they create the read-only browsing role and
  # the three login roles, here with the local passwords below (also the defaults in .env.example). They run once, on an
  # empty volume.
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: circaso
      CIRCASO_READONLY_PASSWORD: circaso_readonly
      CIRCASO_MIGRATOR_PASSWORD: circaso_migrator
      CIRCASO_APP_PASSWORD: circaso_app
      CIRCASO_JOBS_PASSWORD: circaso_jobs
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d circaso"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: browse the local database. Log in with the email and password below, then add a server for host `postgres`.
  pgadmin:
    image: dpage/pgadmin4:9.18
    profiles: [tools]
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@circaso.local
      PGADMIN_DEFAULT_PASSWORD: circaso
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  scylla:
    image: scylladb/scylla:2026.1
    # Small and single-node for a laptop. Keyspaces are created by Kandra (AUTO_CREATE) in local runs.
    command: --smp 1 --memory 1G --overprovisioned 1 --developer-mode 1 --skip-wait-for-gossip-to-settle 0
    ports:
      - "9042:9042"
    volumes:
      - scylla-data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  redis:
    image: valkey/valkey:8-alpine
    # Append-only persistence as in production (appendfsync everysec).
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  scylla-data:
  redis-data:
