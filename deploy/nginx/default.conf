# The only thing open to the internet (ports 80 and 443). The app and Redis are on a private Docker network behind it.
# The whole deploy/nginx folder is mounted at /etc/nginx/conf.d. Only *.conf files load by themselves: this one, and tls.conf if you
# create it from tls.conf.example. The .inc files are included where needed.

include /etc/nginx/conf.d/cloudflare-ips.inc;

# The access log with where the time went: request_time is nginx's whole answer, upstream_connect_time its connect to the app and
# upstream_response_time the app's answer (both "-" when nginx answered itself). A WebSocket's line comes when it closes, and its
# times are the socket's life. The query string is left out ($uri, not $request): it can carry a token.
log_format timed '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent '
                 'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time "$http_user_agent"';
# Turned on in each server block (locations.inc, sandbox-db.conf): one at this level would add to the image's own `main` log, and every
# request would be written twice.

# Per caller address, so one noisy client cannot starve the rest. The app has its own, finer, limits on top.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

# WebSocket upgrades (the realtime socket) and plain requests share one location.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80 default_server;
    server_name _;
    include /etc/nginx/conf.d/locations.inc;
}
