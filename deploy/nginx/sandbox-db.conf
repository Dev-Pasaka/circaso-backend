# pgAdmin at https://sandbox-db.circaso.com, for people Cloudflare Access has let in (Zero Trust > Access > Applications). The name is one
# level under circaso.com because the origin certificate (and Cloudflare's free edge certificate) only covers *.circaso.com.
server {
    listen 443 ssl;
    http2 on;
    server_name sandbox-db.circaso.com;
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    server_tokens off;

    # Only Cloudflare may connect, and only requests Access allowed: Access puts its signed token in this header, so a request without
    # it did not come through Access. Refused here too, in case Access is ever misconfigured.
    if ($from_cloudflare = 0) { return 444; }
    if ($http_cf_access_jwt_assertion = "") { return 403; }

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $pgadmin pgadmin:5050;

    client_max_body_size 50m;
    limit_req zone=api burst=60 nodelay;
    limit_conn perip 40;

    add_header X-Content-Type-Options "nosniff" always;
    # same-origin, not no-referrer: pgAdmin's CSRF check behind HTTPS refuses every call without a same-site Referer.
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://$pgadmin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
    }
}
