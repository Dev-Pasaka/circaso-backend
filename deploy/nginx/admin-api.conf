# The ops gateway, the staff API, at https://admin-api.circaso.com (decision 2026-11-08): its own host, its own upstream
# (the `ops` container on :8081), never the app's.
#
# One host, both environments, by path (decision 2026-11-08): /sandbox/v1/ops/… and /prod/v1/ops/…. Each server's nginx
# answers only its own prefix and strips it before the ops process sees the call (the process serves /v1/ops/ as
# always). This file is the sandbox server's. In Cloudflare, an Origin Rule on admin-api.circaso.com sends /prod/* to the
# production server, so production calls never pass through this one. The production copy swaps the two prefixes'
# roles. Every answer carries Circaso-Environment, and the portal refuses data from the wrong environment. Reference copy only: nothing applies it to a server; to use it, copy
# it to /opt/circaso/nginx with the rest of this folder. The name is one level under circaso.com, which the origin
# certificate (*.circaso.com) covers.
#
# Three locks in a row, like sandbox-db:
#   1. Only Cloudflare may connect ($from_cloudflare, from cloudflare-ips.inc).
#   2. Cloudflare Access (Zero Trust application covering admin.circaso.com and admin-api.circaso.com): a request it
#      let through carries Cf-Access-Jwt-Assertion. Until Pasaka switches Access on, keep the `if` below commented, or
#      every call (the sandbox dev login included) is refused here.
#   3. The ops gateway verifies that token itself (team certs, AUD tag, issuer, expiry) and maps the email to a role.
server {
    listen 443 ssl;
    http2 on;
    server_name admin-api.circaso.com;
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    server_tokens off;

    if ($from_cloudflare = 0) { return 444; }
    # Once Access is on. CORS preflights (OPTIONS) carry no cookie, so Access must be set to pass OPTIONS to the origin
    # ("Bypass options requests to origin"); the ops gateway answers them for the portal's origins only.
    # set $ops_refuse "";
    # if ($http_cf_access_jwt_assertion = "") { set $ops_refuse "1"; }
    # if ($request_method = OPTIONS) { set $ops_refuse ""; }
    # if ($ops_refuse) { return 403; }

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream ops:8081;

    client_max_body_size 1m;          # staff send short JSON only
    limit_req zone=api burst=30 nodelay;
    limit_conn perip 20;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # The process's health is for the container check, not the internet.
    location /health/ { return 404; }

    location /sandbox/v1/ops/ {
        rewrite ^/sandbox(/v1/ops/.*)$ $1 break;
        include /etc/nginx/conf.d/proxy.inc;
    }

    # Production is a different server; reaching this one with /prod/ means the Origin Rule isn't in place yet.
    location /prod/ {
        default_type application/json;
        # add_header here replaces the server's, so HSTS again; CORS so the portal can read why.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Access-Control-Allow-Origin "https://admin.circaso.com" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary Origin always;
        return 503 '{"status":false,"httpStatusCode":503,"code":"ops.environment_unavailable","message":"The production ops API is not reachable yet.","requestId":null,"data":null,"details":null}';
    }

    location / { return 404; }
}
