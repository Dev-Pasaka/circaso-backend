# What `Accept` the app sees on /v1. The app only speaks JSON (and Asha's event stream), and answers a caller that accepts neither with
# a bare 406, which a browser pointed at an API address shows as an empty page. A caller that already asks for JSON, an event stream or
# anything keeps its header; one that asks only for something else (a browser asking for HTML) is told "anything", so it gets the JSON.
map $http_accept $api_accept {
    default               "*/*";
    ""                    "";
    "~*application/json"  $http_accept;
    "~*text/event-stream" $http_accept;
    "~*\*/\*"             $http_accept;
}
