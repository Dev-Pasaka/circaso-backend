name: Deploy to dev

# Every push to main: test, build the image, publish it to Docker Hub, and roll it out to the dev server over SSH.
# GitHub holds only the way in (the SSH key, the Docker Hub token) and the server's address. Everything the server runs with
# lives on the server in /opt/circaso (docker-compose.yml, nginx, certs, .env): this workflow copies nothing there. It logs in,
# starts the new image with the server's docker-compose.yml, waits for ready and prunes old images. It never runs
# migrations: those are run by hand (`./gradlew :app:migrate`).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: circaso-backend   # the Docker Hub repository, under the DOCKERHUB_USERNAME account
  DOCS_IMAGE_NAME: circaso-docs # the API reference, its own small image (docs-ui/)

concurrency:
  group: deploy-dev
  cancel-in-progress: false   # a deploy in flight finishes; the next one waits

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    name: Build and publish the image
    # Runs beside the tests, not after them: the deploy job waits for both, so a commit that fails its tests
    # leaves an unused image on Docker Hub but is never deployed.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev   # the Docker Hub username and token are stored on this environment
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: ref
        # The tag is the commit, so every deploy is exactly one commit.
        run: echo "image=${{ vars.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The server is compiled here, where Gradle's cache works; the Dockerfile only packages the result.
      - run: ./gradlew :app:installDist -x test --console=plain
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ref.outputs.image }}
          provenance: false

  docs-image:
    name: Build and publish the docs image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: ref
        run: echo "image=${{ vars.DOCKERHUB_USERNAME }}/${DOCS_IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
      - run: bun run build.ts
        working-directory: docs-ui
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docs-ui
          push: true
          tags: ${{ steps.ref.outputs.image }}
          provenance: false

  deploy:
    name: Deploy to the dev server
    needs: [ci, image, docs-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: dev
      url: ${{ vars.DEV_URL }}
    steps:
      - name: SSH setup
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEV_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server's host key is pinned, so a stranger answering on that address is refused instead of trusted on first use.
          printf '%s\n' "$DEV_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_SSH_KNOWN_HOSTS: ${{ vars.DEV_SSH_KNOWN_HOSTS }}
      - name: Roll out
        # Runs on the server, in /opt/circaso, with the docker-compose.yml and .env that live there. The Docker Hub token
        # goes in on stdin with the script, so it is never on a command line or in a file on the server.
        run: |
          {
            printf 'REGISTRY_TOKEN=%q\nREGISTRY_USER=%q\nIMAGE=%q\nDOCS_IMAGE=%q\n' \
              "$REGISTRY_TOKEN" "$REGISTRY_USER" "$IMAGE" "$DOCS_IMAGE"
            cat <<'REMOTE'
          set -euo pipefail
          cd /opt/circaso
          printf '%s' "$REGISTRY_TOKEN" | docker login -u "$REGISTRY_USER" --password-stdin >/dev/null
          trap 'docker logout >/dev/null 2>&1 || true' EXIT
          export IMAGE DOCS_IMAGE APP_VERSION="${IMAGE##*:}"

          echo "pulling $IMAGE and $DOCS_IMAGE"
          docker pull --quiet "$IMAGE" >/dev/null </dev/null
          docker pull --quiet "$DOCS_IMAGE" >/dev/null </dev/null

          echo "starting"
          docker compose up -d --remove-orphans </dev/null

          ready=
          for _ in $(seq 1 40); do
            if docker compose exec -T app curl -fsS http://localhost:8080/health/ready >/dev/null 2>&1 </dev/null; then
              ready=yes
              break
            fi
            sleep 3
          done
          if [ -z "$ready" ]; then
            docker compose logs --tail 60 app </dev/null || true
            echo "the new version did not become ready"
            exit 1
          fi

          echo "$IMAGE" > .current
          echo "deployed $IMAGE"
          docker image prune -af >/dev/null </dev/null
          df -h / | awk 'NR==2 {print "disk used: " $5 " of " $2}'
          REMOTE
          } | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${{ vars.DEV_USER }}@${{ vars.DEV_HOST }}" bash -s
        env:
          REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REGISTRY_USER: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE: ${{ needs.image.outputs.image }}
          DOCS_IMAGE: ${{ needs.docs-image.outputs.image }}
      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
