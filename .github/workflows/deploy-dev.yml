name: Deploy to dev

# Every push to main: test, build the image, publish it to Docker Hub, and roll it out to the dev server over SSH.
# GitHub holds only the way in (the SSH key, the Docker Hub token, the Infisical machine identity) and the server's
# address. Everything the server runs with lives on the server in /opt/circaso (docker-compose.yml, nginx, certs,
# .env): this workflow copies nothing there but deploy/nginx (step "Sync nginx"). The app's .env is written from Infisical at each deploy (2026-11-15):
# variable INFISICAL_MODE is `off` (or unset: the .env on the server is used as it is), `check` (fetch and say which
# names differ from the .env in use, change nothing) or `on` (fetch, then replace .env; the one before is kept as
# .env.prev). Values are never printed. If Infisical can't be reached the deploy stops before anything is restarted.
# postgres.env and backup.env stay on the server: they are read when the database is first created, not at deploy.
# It logs in, runs the migrations once with the new image (the server reaches its PostgreSQL; a laptop does
# not), starts the new image with the server's docker-compose.yml, waits for ready and prunes old images. A failed
# migration stops the deploy before anything is restarted, so the old version keeps serving.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: circaso-backend   # the Docker Hub repository, under the DOCKERHUB_USERNAME account
  DOCS_IMAGE_NAME: circaso-docs # the API reference, its own small image (docs-ui/)

concurrency:
  group: deploy-dev
  cancel-in-progress: false   # a deploy in flight finishes; the next one waits

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit   # GRADLE_ENCRYPTION_KEY, for Gradle's configuration cache

  image:
    name: Build and publish the image
    # Runs beside the tests, not after them: the deploy job waits for both, so a commit that fails its tests
    # leaves an unused image on Docker Hub but is never deployed.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev   # the Docker Hub username and token are stored on this environment
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: ref
        # The tag is the commit, so every deploy is exactly one commit.
        run: echo "image=${{ vars.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          # CI's "Compile and lint" job saves the caches on main; this one only reads them (its compile is all cache hits).
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # The server is compiled here, where Gradle's cache works; the Dockerfile only packages the result.
      - run: ./gradlew :app:installDist -x test --console=plain
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ref.outputs.image }}
          provenance: false

  docs-image:
    name: Build and publish the docs image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: ref
        run: echo "image=${{ vars.DOCKERHUB_USERNAME }}/${DOCS_IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      # Bun from npm, not setup-bun: GitHub's release downloads returned 504 to runners for hours (2026-11-09) and
      # blocked deploys. npm serves the same binary from its own CDN.
      - name: Install Bun
        run: npm install -g bun@1.4.0 && bun --version
      - run: bun run build.ts
        working-directory: docs-ui
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docs-ui
          push: true
          tags: ${{ steps.ref.outputs.image }}
          provenance: false

  deploy:
    name: Deploy to the dev server
    needs: [ci, image, docs-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: dev
      url: ${{ vars.DEV_URL }}
    steps:
      - name: SSH setup
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEV_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server's host key is pinned, so a stranger answering on that address is refused instead of trusted on first use.
          printf '%s\n' "$DEV_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_SSH_KNOWN_HOSTS: ${{ vars.DEV_SSH_KNOWN_HOSTS }}
      - name: Check out the nginx config
        uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/nginx
          sparse-checkout-cone-mode: false
      - name: Sync nginx
        # deploy/nginx is the source of truth for the server's /opt/circaso/nginx (mounted read-only as the nginx container's
        # conf.d). Files only on the server (tls.conf, local extras) are left alone. The new files are tested with `nginx -t`
        # before nginx reloads; a failing test puts the previous files back and stops the deploy before the app is touched, so a
        # bad config can never take the site down. The last ten previous versions stay in /opt/circaso/nginx-backups.
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes ${{ vars.DEV_USER }}@${{ vars.DEV_HOST }}"
          tar czf - -C deploy nginx | $SSH 'rm -rf /opt/circaso/nginx-incoming && mkdir -p /opt/circaso/nginx-incoming && tar xzf - -C /opt/circaso/nginx-incoming'
          $SSH bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/circaso
          backup="nginx-backups/$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p "$backup"
          cp -a nginx/. "$backup"/
          cp -a nginx-incoming/nginx/. nginx/
          rm -rf nginx-incoming
          # The container by its compose label: `docker compose exec` would need IMAGE and DOCS_IMAGE, set only in Roll out.
          ngx=$(docker ps -q --filter label=com.docker.compose.service=nginx | head -n1)
          if [ -z "$ngx" ]; then
            cp -a "$backup"/. nginx/
            echo "nginx: no running nginx container; the previous files are back and nothing was deployed"
            exit 1
          fi
          if out=$(docker exec "$ngx" nginx -t 2>&1 </dev/null); then
            docker exec "$ngx" nginx -s reload </dev/null
            echo "nginx: synced and reloaded (previous files in $backup)"
          else
            echo "$out" | tail -5
            cp -a "$backup"/. nginx/
            echo "nginx: the new config failed its test; the previous files are back and nothing was deployed"
            exit 1
          fi
          ls -1dt nginx-backups/* | tail -n +11 | xargs -r rm -rf
          REMOTE
      - name: Roll out
        # Runs on the server, in /opt/circaso, with the docker-compose.yml and .env that live there. The Docker Hub token
        # goes in on stdin with the script, so it is never on a command line or in a file on the server.
        run: |
          {
            printf 'REGISTRY_TOKEN=%q\nREGISTRY_USER=%q\nIMAGE=%q\nDOCS_IMAGE=%q\n' \
              "$REGISTRY_TOKEN" "$REGISTRY_USER" "$IMAGE" "$DOCS_IMAGE"
            printf 'INFISICAL_MODE=%q\nINFISICAL_TOKEN=%q\nINFISICAL_CLIENT_ID=%q\nINFISICAL_CLIENT_SECRET=%q\nINFISICAL_PROJECT=%q\nINFISICAL_ENV=%q\nINFISICAL_PATH=%q\nINFISICAL_API=%q\n' \
              "${INFISICAL_MODE:-off}" "$INFISICAL_TOKEN" "$INFISICAL_CLIENT_ID" "$INFISICAL_CLIENT_SECRET" "$INFISICAL_PROJECT" "${INFISICAL_ENV:-dev}" "${INFISICAL_PATH:-/}" "$INFISICAL_API"
            cat <<'REMOTE'
          set -euo pipefail
          cd /opt/circaso
          printf '%s' "$REGISTRY_TOKEN" | docker login -u "$REGISTRY_USER" --password-stdin >/dev/null
          trap 'docker logout >/dev/null 2>&1 || true' EXIT
          export IMAGE DOCS_IMAGE APP_VERSION="${IMAGE##*:}"

          echo "pulling $IMAGE and $DOCS_IMAGE"
          docker pull --quiet "$IMAGE" >/dev/null </dev/null
          docker pull --quiet "$DOCS_IMAGE" >/dev/null </dev/null

          # The app's settings, from Infisical (see the top of this file). The identity's secret and the token live only
          # in this shell; the fetched file is readable by the deploy user alone.
          if [ "$INFISICAL_MODE" = check ] || [ "$INFISICAL_MODE" = on ]; then
            echo "settings: fetching from Infisical ($INFISICAL_MODE)"
            umask 077
            if [ -n "$INFISICAL_API" ]; then export INFISICAL_DOMAIN="$INFISICAL_API"; fi
            # The machine identity's access token (Token Auth, secret INFISICAL_TOKEN); without one, its Universal Auth
            # client id and secret are exchanged for a token here. A token has an end date: a refused fetch after
            # a quiet month means a new one is due.
            if [ -z "$INFISICAL_TOKEN" ]; then
              export INFISICAL_UNIVERSAL_AUTH_CLIENT_ID="$INFISICAL_CLIENT_ID" INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET="$INFISICAL_CLIENT_SECRET"
              INFISICAL_TOKEN=$(infisical login --method=universal-auth --silent --plain </dev/null)
            fi
            export INFISICAL_TOKEN
            unset INFISICAL_UNIVERSAL_AUTH_CLIENT_ID INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET INFISICAL_CLIENT_SECRET
            trap 'rm -f /opt/circaso/.env.new /opt/circaso/.env-check.yml; docker logout >/dev/null 2>&1 || true' EXIT
            # --expand=false: a $ in a value stays a $, as it is in the .env.
            infisical export --silent --projectId "$INFISICAL_PROJECT" --env "$INFISICAL_ENV" --path "$INFISICAL_PATH" \
              --format dotenv --expand=false </dev/null > .env.new
            unset INFISICAL_TOKEN
            # What the app and ops containers would be given, read the way Docker Compose reads it, against what they
            # are given now. Names only. Fewer than half the values means the wrong project, environment or folder.
            printf 'services:\n  app:\n    env_file: !override [.env.new]\n  ops:\n    env_file: !override [.env.new]\n' > .env-check.yml
            python3 - <<'PY'
          import json, subprocess, sys
          def given(extra):
              out = subprocess.run(["docker", "compose", "-f", "docker-compose.yml", *extra, "config", "--format", "json"],
                                   check=True, capture_output=True, text=True, stdin=subprocess.DEVNULL).stdout
              return {s: json.loads(out)["services"][s].get("environment") or {} for s in ("app", "ops")}
          now, new = given([]), given(["-f", ".env-check.yml"])
          short = False
          for s in ("app", "ops"):
              a, b = now[s], new[s]
              added, removed = sorted(set(b) - set(a)), sorted(set(a) - set(b))
              changed = sorted(k for k in set(a) & set(b) if a[k] != b[k])
              print(f"settings: {s}: {len(b)} values; added {len(added)}, removed {len(removed)}, changed {len(changed)}")
              for label, names in (("added", added), ("removed", removed), ("changed", changed)):
                  if names:
                      print(f"settings:   {label}: {' '.join(names)}")
              short = short or len(b) * 2 < len(a)
          if short:
              print("settings: Infisical returned fewer than half the values in use; nothing was changed")
              sys.exit(1)
          PY
            rm -f .env-check.yml
            if [ "$INFISICAL_MODE" = on ]; then
              cp -p .env .env.prev
              mv .env.new .env
              echo "settings: .env replaced from Infisical (the one before is .env.prev)"
            else
              rm -f .env.new
              echo "settings: check only, the .env on the server is unchanged"
            fi
          fi

          # The migrations run once, from the new image, with the server's .env and network, before any container is replaced.
          # They are idempotent; if they fail, set -e stops here and the old containers are untouched.
          echo "migrating"
          if ! docker compose run --rm --no-deps -T --entrypoint java app -cp "/app/lib/*" com.circaso.app.Migrate \
            </dev/null >/tmp/migrate.log 2>&1; then
            tail -n 40 /tmp/migrate.log
            rm -f /tmp/migrate.log
            echo "the migrations failed; nothing was restarted"
            exit 1
          fi
          tail -n 10 /tmp/migrate.log
          rm -f /tmp/migrate.log

          echo "starting"
          docker compose up -d --remove-orphans </dev/null

          # /health/ready answers 503 until the app has warmed up (every module's read-only hot paths, at most
          # WARMUP_BUDGET_MS, 15 s by default) and every connection answers, so success here means a warm process.
          ready=
          started=$(date +%s)
          for _ in $(seq 1 60); do
            if docker compose exec -T app curl -fsS http://localhost:8080/health/ready >/dev/null 2>&1 </dev/null; then
              ready=yes
              break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            docker compose logs --tail 60 app </dev/null || true
            echo "the new version did not become ready"
            exit 1
          fi
          echo "ready after $(( $(date +%s) - started )) s"
          docker compose logs --no-log-prefix app </dev/null 2>/dev/null | grep -m1 -E 'Warm-up (done|ran out)' || true

          # What is running, for a manual restart (/opt/circaso/up.sh) and for rolling back
          echo "$IMAGE" > .current
          echo "$DOCS_IMAGE" > .current-docs
          echo "deployed $IMAGE"
          docker image prune -af >/dev/null </dev/null
          df -h / | awk 'NR==2 {print "disk used: " $5 " of " $2}'
          REMOTE
          } | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${{ vars.DEV_USER }}@${{ vars.DEV_HOST }}" bash -s
        env:
          REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          INFISICAL_MODE: ${{ vars.INFISICAL_MODE }}
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT: ${{ vars.INFISICAL_PROJECT_ID }}
          INFISICAL_ENV: ${{ vars.INFISICAL_ENV }}
          INFISICAL_PATH: ${{ vars.INFISICAL_PATH }}
          INFISICAL_API: ${{ vars.INFISICAL_DOMAIN }}
          REGISTRY_USER: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE: ${{ needs.image.outputs.image }}
          DOCS_IMAGE: ${{ needs.docs-image.outputs.image }}
      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
