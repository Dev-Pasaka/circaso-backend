name: CI

# Builds and tests every change. The deploy workflow calls this too, so main is only ever deployed after it passes.
#
# Split across runners so a change is checked in about 3 minutes (decision 2026-11-08). Inside one Gradle build only
# one test suite runs at a time (build-logic TestLimit: each suite starts its own PostgreSQL and Valkey, and two at once
# starve a machine), so the suites are spread over separate jobs instead. Each runs on its own machine with its own
# containers. Compiling is shared through Gradle's build cache, which main's runs fill and every other run reads.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  # The suites that take longest, in jobs of their own (measured 2026-11-08; keep every job's suites under ~90 s). Everything else runs in `rest`,
  # so a new module is tested without touching this file.
  HEAVY: >-
    :infrastructure:impl:test
    :modules:messaging:impl:test
    :app:test
    :modules:assistant:impl:test
    :modules:identity:impl:test
    :integrations:impl:test
    :architecture-tests:test
    :modules:wallet:impl:test
    :modules:users:impl:test
    :gateway:test

jobs:
  static:
    name: Compile and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Lets Gradle's configuration cache be saved and restored (about 40 s of every job). Without the secret it
          # is simply not saved.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # Only this job saves Gradle's caches (on main): it compiles every module, so its build cache serves all
          # the others. Several jobs saving at once only fight over the same cache key.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Everything `build` does except the tests: compile, jars, spotless, detekt and the other checks.
      - run: ./gradlew build -x test --console=plain

  tests:
    name: Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: infrastructure
            tasks: ":infrastructure:impl:test"
          - shard: messaging
            tasks: ":modules:messaging:impl:test"
          - shard: app
            tasks: ":app:test"
            # The longest single suite: two test processes, each with its own containers, on this runner of its own.
            forks: 2
          - shard: assistant
            tasks: ":modules:assistant:impl:test"
          - shard: identity
            tasks: ":modules:identity:impl:test"
          - shard: wallet + integrations + edge
            tasks: ":integrations:impl:test :architecture-tests:test :modules:wallet:impl:test :modules:users:impl:test :gateway:test"
          - shard: rest
            tasks: rest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true
      # The tests start PostgreSQL 18 and Valkey in Docker (Testcontainers), which the runner has. Pulled while
      # Gradle compiles, so the first suite doesn't wait for them.
      - name: Pull the test containers
        run: (docker pull -q postgres:18 && docker pull -q valkey/valkey:8-alpine) > /dev/null &
      - name: Test
        run: |
          if [ "${{ matrix.tasks }}" = rest ]; then
            excluded=""
            for t in $HEAVY; do excluded="$excluded -x $t"; done
            ./gradlew test $excluded --console=plain
          else
            ./gradlew ${{ matrix.tasks }} -Pcircaso.testForks=${{ matrix.forks || 1 }} --console=plain
          fi

  docs-ui:
    name: API reference (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Bun from npm, not setup-bun: GitHub's release downloads returned 504 to runners for hours (2026-11-09) and
      # blocked deploys. npm serves the same binary from its own CDN.
      - name: Install Bun
        run: npm install -g bun@1.4.0 && bun --version
      - run: bun test
        working-directory: docs-ui
      # The reader must still build: the docs image is made from dist/.
      - run: bun run build.ts
        working-directory: docs-ui

  # One result for the whole server, under the name the checks have always had.
  server:
    name: Build and test the server
    runs-on: ubuntu-latest
    needs: [static, tests]
    if: always()
    steps:
      - run: |
          [ "${{ needs.static.result }}" = success ] && [ "${{ needs.tests.result }}" = success ] || {
            echo "compile and lint: ${{ needs.static.result }}; tests: ${{ needs.tests.result }}"
            exit 1
          }
