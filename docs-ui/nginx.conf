# The docs image: the reader's static files, nothing else. The spec (/docs/openapi.json) is not here: the proxy in front
# sends it to the app, which builds it from its routes.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # The reader runs its own script, fetches the spec from the same origin, and uses data: for its icon.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; connect-src 'self'; base-uri 'none'; form-action 'none'" always;
    # Files change with every deploy: the browser asks "changed?" (ETag) and usually gets a 304.
    add_header Cache-Control "no-cache" always;

    location = /health { access_log off; return 200 "ok\n"; }
    location = /docs { try_files /docs/index.html =404; }
    location ^~ /docs/ { try_files $uri =404; }
    location / { return 404; }
}
